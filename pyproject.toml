[project]
name = "lox-tp"
version = "0.1.0"
description = "Intérprete y Compilador de Lox para Lenguajes y Compiladores (FIUBA)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pylox = "lox.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
